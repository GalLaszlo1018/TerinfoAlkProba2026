<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google térkép JavaScripttel</title>
  <style>
    #map { height: 400px; }
    h1 { color: #137333; }
    p { color: #b06000; font-weight: bold; }
  </style>

</head>
<body>

<h1>Google térképem JavaScripttel</h1>
<p>Ez a budapesti libegő felső állomása.</p>

<div id="map"></div>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDNGtw2yUiyjsHpTu7vL9PXo7tDA9do7mc&callback=initMap&v=weekly&libraries=marker"
  defer
></script>

<script>
  async function initMap() {
    const { Map } = await google.maps.importLibrary("maps");
    const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

    const hely = { lat: 47.51587857646459, lng: 18.960334328856984 };

    const map = new Map(document.getElementById("map"), {
      center: hely,
      zoom: 17,
      mapId: "DEMO_MAP_ID",
    });

        const pin = new PinElement({
      scale: 1.5,
      background: "#FBBC04",
      borderColor: "#137333",
      glyphText: "L",
      glyphColor: "white",
    });

    const marker = new AdvancedMarkerElement({
      map: map,
      position: hely,
      title: "Libegő felső állomása",
    });
    marker.append(pin);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Térkép</title>
 
<style>
	#map {
    margin: 0 auto;
    height: 600px;
    width: 90%;
    border: 3px solid black;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
</style>
</head>
<body>

<h1>Itt lesz a térképem</h1>
<div id="map"></div>

<script>
function initMap() {

  const pozicio = {
    lat: 47.5371191,
    lng: 18.5899557
  };

  const map = new google.maps.Map(
    document.getElementById("map"),
    {
      zoom: 9,
      center: pozicio
    }
  );

const marker = new google.maps.Marker({
  position: pozicio,
  map: map,
  icon: "https://maps.google.com/mapfiles/kml/shapes/homegardenbusiness.png"
});

  marker.addListener("click", () => {
    alert("A markerre kattintottál!");
  });
}

</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsbfYUGfwQl1uLmHiBjHm6wqCtw77O6rg&callback=initMap">
</script>

</body>
</html>

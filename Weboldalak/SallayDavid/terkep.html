<html>
<head>
<h1>Google térkép</h1>
  <title>Add a Map using HTML</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./index.js"></script>
</head>
<body>
  <gmp-map
    center="47.369918,20.631614"
    zoom="6"
    map-id="DEMO_MAP_ID"
    style="height: 400px"
  >
  </gmp-map>
  <!--
    The `defer` attribute causes the script to execute after the full HTML
    document has been parsed. -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAmVuH_e5c6wToSwypEHk_7C6dVRwzwWSc&libraries=maps"
    defer
  ></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google Térkép</title>
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

<h1 style="text-align:center">Google Térkép</h1>

<div id="map"></div>

<script>
async function initMap() {
    const { Map } = await google.maps.importLibrary("maps");
    const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

    const map = new Map(document.getElementById("map"), {
        center: {
            lat: 47.4968478,
            lng: 19.0696438
        },
        zoom: 15,
        mapId: "DEMO_MAP_ID"
    });

    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.style.fontSize = "32px";

    new AdvancedMarkerElement({
        map,
        position: {
            lat: 47.4968772,
            lng: 19.07044
        },
        content: heart
    });
}

window.initMap = initMap;
</script>

<script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAVArAazEVXfc1ihdx-D9mcu_x0GWV_eKg&callback=initMap&libraries=marker"
    async
    defer>
</script>

</body>
</html>
